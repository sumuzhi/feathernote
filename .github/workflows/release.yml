# GitHub Actions：推送到 main（或打 v* tag）后自动构建 Release APK 并发布。
#
# 产物语义与本地 `scripts/release.sh` 完全一致：
#   - arm64-v8a 单架构 split APK（真实 versionCode = 2000 + pubspec build number）；
#   - 相同的 --dart-define 集合（Key 从 GitHub Secrets 注入，绝不写进仓库）；
#   - 构建戳 BUILD_STAMP = MMDD-HHMM/<短SHA>（时区 Asia/Shanghai，与本地一致）。
#
# 发布形态：
#   - push 到 main   → 滚动更新 tag 为 `latest` 的 **Pre-release**（覆盖旧版）；
#   - push `v*` tag  → 正式 Release（如 v1.0.19）。
# 两者都会把 APK + version.json + 校验和作为附件上传。
#
# ## 必须配置的 GitHub Secrets（Settings → Secrets and variables → Actions）
#   DASHSCOPE_API_KEY              必填。百炼 API Key（sk- 开头）。缺失时构建
#                                  **故意失败**——绝不发布降级 MockEngine 的假发布包。
#   DASHSCOPE_WORKSPACE_ID         可选。百炼业务空间 ID。
#   ANDROID_DEBUG_KEYSTORE_BASE64  可选但强烈建议。base64(~/.android/debug.keystore)。
#                                  release 包使用 debug 签名（signingConfig=debug）；
#                                  不提供时 CI 用 runner 自造的 debug key——
#                                  与本机构建的 APK **签名不一致，无法覆盖安装**。
#                                  上传本机 debug.keystore 后两者签名一致。
#   导出命令：base64 -i ~/.android/debug.keystore | pbcopy
#
# ⚠️ 本仓库是公开仓库：任何密钥只能走 Secrets，禁止写进任何被提交的文件。
name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      DASHSCOPE_WORKSPACE_ID: ${{ secrets.DASHSCOPE_WORKSPACE_ID }}
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 前置检查（密钥）
        run: |
          set -euo pipefail
          if [ -z "${DASHSCOPE_API_KEY:-}" ]; then
            echo "::error::缺少 Secret DASHSCOPE_API_KEY——请在 Settings → Secrets and variables → Actions 配置后重跑（Actions 页可 workflow_dispatch）。绝不发布降级 MockEngine 的包。"
            exit 1
          fi
          case "${DASHSCOPE_API_KEY}" in
            sk-*) echo "密钥格式 OK（不回显）" ;;
            *) echo "::error::DASHSCOPE_API_KEY 应以 sk- 开头，疑似配置污染。"; exit 1 ;;
          esac

      - name: 还原 debug 签名（保持与本机构建签名一致，支持覆盖安装）
        if: ${{ env.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          echo "${ANDROID_DEBUG_KEYSTORE_BASE64}" | base64 -d > "$HOME/.android/debug.keystore"
          echo "debug.keystore 已还原（$(stat -c%s "$HOME/.android/debug.keystore") bytes）"

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 版本确认
        run: |
          flutter --version
          dart --version

      - name: 拉取依赖
        run: flutter pub get

      - name: 测试门禁
        run: flutter test

      - name: 计算版本与构建戳
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')"
          BUILD_NO="$(grep '^version:' pubspec.yaml | sed 's/.*+//')"
          SHA="$(git rev-parse --short HEAD)"
          STAMP="$(TZ=Asia/Shanghai date +%m%d-%H%M)/${SHA}"
          STAMP_FILE="$(TZ=Asia/Shanghai date +%m%d-%H%M)-${SHA}"
          {
            echo "version=${VERSION}"
            echo "build_no=${BUILD_NO}"
            echo "sha=${SHA}"
            echo "stamp=${STAMP}"
            echo "stamp_file=${STAMP_FILE}"
            echo "apk_name=feathernote-release-${STAMP_FILE}-arm64.apk"
          } >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}+${BUILD_NO} sha=${SHA} stamp=${STAMP}"

      - name: 构建 arm64-v8a Release APK
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --dart-define=DASHSCOPE_API_KEY="${DASHSCOPE_API_KEY}" \
            --dart-define=DASHSCOPE_WORKSPACE_ID="${DASHSCOPE_WORKSPACE_ID:-}" \
            --dart-define=BAILIAN_REGION="${BAILIAN_REGION:-cn-beijing}" \
            --dart-define=BAILIAN_REALTIME_MODEL="qwen-audio-3.0-asr-flash-streaming" \
            --dart-define=BAILIAN_FILETRANS_MODEL="${BAILIAN_FILETRANS_MODEL:-qwen-audio-3.1-asr-flash-filetrans}" \
            --dart-define=BAILIAN_LLM_MODEL="${BAILIAN_LLM_MODEL:-qwen3.7-plus}" \
            --dart-define=ENGINE_PROVIDER="${ENGINE_PROVIDER:-bailian}" \
            --dart-define=LOG_LEVEL="${LOG_LEVEL:-debug}" \
            --dart-define=SMART_MINUTES_VERSION="${{ steps.meta.outputs.version }}" \
            --dart-define=BUILD_STAMP="${{ steps.meta.outputs.stamp }}"

      - name: 校验真实 versionCode（aapt2 实读，必须含 ABI 偏移）
        run: |
          set -euo pipefail
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -1)"
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          CODE="$("$AAPT" dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]\{1,\}\)'.*/\1/p" | head -1)"
          echo "APK 实读 versionCode=${CODE}（pubspec build number=${{ steps.meta.outputs.build_no }}）"
          case "${CODE}" in
            2*) echo "ABI 偏移确认（2000 × arm64=2）" ;;
            *) echo "::error::versionCode(${CODE}) 未检测到 2000× ABI 偏移——是否漏了 --split-per-abi？"; exit 1 ;;
          esac

      - name: 产物整理（重命名 + MD5/SHA256 + version.json）
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APK_NAME="${{ steps.meta.outputs.apk_name }}"
          cp "$APK" "dist/${APK_NAME}"
          MD5="$(md5sum "dist/${APK_NAME}" | cut -d' ' -f1)"
          SHA256="$(sha256sum "dist/${APK_NAME}" | cut -d' ' -f1)"
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort | tail -1)"
          APK_CODE="$("$AAPT" dump badging "dist/${APK_NAME}" | sed -n "s/.*versionCode='\([0-9]\{1,\}\)'.*/\1/p" | head -1)"
          cat > dist/version.json <<EOF
          {
            "version": "${{ steps.meta.outputs.version }}",
            "versionCode": ${APK_CODE},
            "buildStamp": "${{ steps.meta.outputs.stamp }}",
            "minVersionCode": 1,
            "downloadUrl": "https://github.com/sumuzhi/feathernote/releases/latest",
            "md5": "${MD5}",
            "sha256": "${SHA256}",
            "forceUpdate": false
          }
          EOF
          {
            echo "APK_NAME=${APK_NAME}"
            echo "MD5=${MD5}"
            echo "APK_CODE=${APK_CODE}"
          } >> "$GITHUB_ENV"
          {
            echo "## 构建产物"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本 | ${{ steps.meta.outputs.version }}+${{ steps.meta.outputs.build_no }} |"
            echo "| versionCode（APK 实读） | ${APK_CODE} |"
            echo "| 构建戳 | \`${{ steps.meta.outputs.stamp }}\` |"
            echo "| MD5 | \`${MD5}\` |"
            echo "| SHA256 | \`${SHA256}\` |"
            echo ""
            echo "APK 附件：\`${APK_NAME}\`（arm64-v8a，debug 签名）"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传构建产物（workflow artifact，任何 push 都可下载）
        uses: actions/upload-artifact@v4
        with:
          name: feathernote-apk-${{ steps.meta.outputs.stamp_file }}
          path: dist/
          if-no-files-found: error

      - name: 清理旧的滚动 Release（仅 main 推送）
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null \
            || echo "无旧 latest Release（首跑正常）"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('声羽 FeatherNote {0}', github.ref_name) || format('声羽 FeatherNote {0}（滚动构建）', steps.meta.outputs.version) }}
          body: |
            自动构建（GitHub Actions）。

            - **版本**：${{ steps.meta.outputs.version }}+${{ steps.meta.outputs.build_no }}（APK versionCode=${{ env.APK_CODE }}）
            - **构建戳**：`${{ steps.meta.outputs.stamp }}`
            - **MD5**：`${{ env.MD5 }}`
            - **提交**：${{ steps.meta.outputs.sha }}
            - **架构**：arm64-v8a（debug 签名，与本地发布物同签名语义）

            安装：下载 APK 附件直接安装；覆盖安装要求签名一致（见仓库 workflow 注释）。
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
          files: dist/*
          fail_on_unmatched_files: true
