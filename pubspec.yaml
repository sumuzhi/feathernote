name: smart_minutes_flutter
description: 智能会议纪要 · 移动端（Flutter + Dart 本地后端，无外部服务器）
publish_to: 'none'

# versionName+versionCode：Android 侧读这里。
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# 依赖按字母序排列（`sort_pub_dependencies`）；说明写在行内注释里。
dependencies:
  archive: ^3.6.1 # 导出 Word：纯 Dart 生成 docx（zip + OOXML）
  dio: ^5.11.1 # SSE 流式读取 + 拦截器 + 超时/取消
  drift: ^2.35.0 # 类型安全 SQL（schema 用原始 DDL 建表，见 storage/schema.dart）
  drift_flutter: ^0.3.1 # 后台 isolate 打开数据库，避免阻塞 UI 线程
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3 # 前台服务类型固定 microphone（Android 15 合规）
  flutter_markdown_plus: ^1.0.12 # 原 flutter_markdown 已于 2025-02 停止维护
  file_picker: ^10.0.2 # 「每次导出时选择位置」：系统另存为（SAF）
  flutter_riverpod: ^3.4.3 # Riverpod 3：注意「同一 List 实例被 == 过滤」的陷阱
  go_router: ^18.0.1
  just_audio: ^0.10.6 # 本地 WAV 回放 + seek（跳播）
  markdown: ^7.3.1
  media_store_plus: ^0.1.3 # 默认导出位置：MediaStore 写公共 Download/SmartMinutes（Android 10+ 零权限）
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.11.1 # 导出 PDF：复用随包 NotoSansSC 字体（中文不缺字形）
  permission_handler: ^13.0.2 # 麦克风 / 通知 运行时权限
  record: ^7.1.1 # Android pcm16bits Stream；可指定 sampleRate / numChannels
  # sqlite3 3.x 起自带原生库，**不要**再引 sqlite3_flutter_libs（0.6.0 起已是空包 / EOL）。
  sqlite3: ^3.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  fake_async: ^1.3.1 # 假时钟：驱动看门狗 / 超时等 Timer 逻辑（波形与录音计时）
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4 # 由 brand-assets/icon-1024 生成全密度启动图标
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

# App 图标：brand-assets 渲染产物。主题色方案：橙底（#F0783C）+ 白色前景图形。
# 运行 `dart run flutter_launcher_icons` 重新生成 android res。
flutter_launcher_icons:
  image_path: "assets/brand/icon-combined-1024.png"
  android: true
  ios: false
  adaptive_icon_background: "#F0783C"
  adaptive_icon_foreground: "assets/brand/icon-fg-1024.png"

flutter:
  uses-material-design: true
  assets:
    - assets/prompts/minutes.md
    - assets/brand/
  # 设计稿指定 Noto Sans SC：随包 asset（离线可用，不走 google_fonts 运行时下载）。
  # 仅随包 400 / 600 两档，其余字重由 Flutter 就近匹配（见 DESIGN-SPEC 2.4）。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-SemiBold.ttf
          weight: 600
